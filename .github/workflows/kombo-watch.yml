name: CS2 kombo-watch

on:
  schedule:
    - cron: "*/30 * * * *"   # backup: starter den igen, hvis den er stoppet
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test: skriv beskeder i loggen i stedet for Discord"
        type: boolean
        default: false
      lookback_blocks:
        description: "Kig X blokke tilbage (0 = normal). 1800 = ca. 1 time"
        default: "0"
      min_payout:
        description: "Mindste samlede udbetaling i USD"
        default: "1000"

permissions:
  actions: write
  contents: write

concurrency:
  group: kombo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kør kombo-watch (ca. 5,7 timer)
        run: python -u combo_watch.py
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOOKBACK_BLOCKS: ${{ inputs.lookback_blocks || '0' }}
          MIN_PAYOUT: ${{ inputs.min_payout || '1000' }}
          RUN_SECONDS: ${{ (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.lookback_blocks != '0')) && '0' || '20500' }}

      - name: Gem hvor langt botten er nået
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "kombo-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state [skip ci]" && git pull --rebase && git push)
          fi

      - name: Start næste omgang
        if: success() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kombo-watch.yml --ref ${{ github.ref_name }}
