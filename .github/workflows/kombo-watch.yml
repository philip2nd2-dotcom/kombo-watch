name: CS2 kombo-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # ca. hvert 5. minut (GitHub kan forsinke lidt)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test: skriv beskeder i loggen i stedet for Discord"
        type: boolean
        default: false
      lookback_blocks:
        description: "Kig X blokke tilbage (0 = normal). 1800 = ca. 1 time"
        default: "0"
      min_payout:
        description: "Mindste samlede udbetaling i USD"
        default: "1000"

permissions:
  contents: write

concurrency:
  group: kombo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kør kombo-watch
        run: python combo_watch.py
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LOOKBACK_BLOCKS: ${{ inputs.lookback_blocks || '0' }}
          MIN_PAYOUT: ${{ inputs.min_payout || '1000' }}

      - name: Gem hvor langt botten er nået
        run: |
          if [ -f state.json ]; then
            git config user.name "kombo-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
          fi
